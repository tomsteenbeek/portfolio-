# Lokale installatie: app + database op je eigen computer.
#   docker compose up -d --build     (of dubbelklik start.bat)
# De app is alleen bereikbaar op deze computer: http://localhost:3000
name: di-portfolio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lokaal-ontwikkel}
      POSTGRES_DB: di_portfolio
    volumes:
      - dbdata:/var/lib/postgresql/data   # gegevens blijven bewaard na herstart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d di_portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Bewust geen poort naar buiten: alleen de app praat met de database.

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-lokaal-ontwikkel}@db:5432/di_portfolio
      SEED_DEV_USERS: "true"
      APP_ENV: production
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: run }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-lokaal-ontwikkel}@db:5432/di_portfolio
      AUTH_MODE: dev
      ALLOW_DEV_LOGIN: "true"        # fictieve gebruikers; veilig omdat de app alleen lokaal bereikbaar is
      COOKIE_SECURE: "false"         # http://localhost
      SESSION_SECRET: ${SESSION_SECRET:?Zet SESSION_SECRET in .env (start.bat doet dit automatisch)}
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:3000:3000"        # alleen bereikbaar vanaf deze computer

volumes:
  dbdata:
